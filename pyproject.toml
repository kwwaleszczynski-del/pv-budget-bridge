[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pv-budget-bridge"
version = "0.1.0"
description = "Monthly budget-to-actual energy bridge for PV plants: P50 budget from PVGIS TMY with pvlib, a waterfall from budget to production (irradiance, temperature, degradation, soiling, snow, clipping, availability, curtailment, residual), PR and weather-corrected PR, example contract guarantee tests and irradiance sensor QC, verified with injected losses on NREL PVDAQ and a synthetic plant."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14",
    "scipy>=1.11",
    "pvlib>=0.11",
    "h5py>=3.9",
    "pyyaml>=6",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pv-budget = "pv_budget.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
